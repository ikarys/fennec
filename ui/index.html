<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fennec</title>
<style>
  :root { --bg: #f6f5f2; --card: #fff; --text: #1d1d1b; --muted: #6b6a66; --line: #e2e0da; --soft: #efede8;
          --accent: #c4622d; --ok: #2f7d4f; --warn: #9a6a12; --bad: #a33a3a; --info: #4a6fa5; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171716; --card: #222220; --text: #ecebe7; --muted: #9a988f; --line: #33322f; --soft: #2b2a28;
            --accent: #e08050; --ok: #5fb383; --warn: #d9a441; --bad: #d46a6a; --info: #7d9ccc; }
  }
  * { box-sizing: border-box; }
  /* A display rule on an element would otherwise beat its hidden attribute. */
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 64px; }
  header { display: flex; align-items: baseline; gap: 16px; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 32px 0 10px; font-weight: 600; }
  .muted { color: var(--muted); }
  select, textarea, button, input { font: inherit; color: inherit; background: var(--card);
         border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; }
  textarea { resize: vertical; min-height: 44px; width: 100%; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.link { border: none; background: none; color: var(--accent); padding: 0; }
  button.quiet { border: none; background: none; color: var(--muted); padding: 8px 4px; font-size: 13px; }
  #new-request { display: grid; grid-template-columns: 180px 1fr auto; gap: 8px; }
  .error { color: var(--bad); font-size: 13px; min-height: 0; margin: 4px 0 0; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
          margin-bottom: 12px; }
  .meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
  .tag { font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--c); }
  .title { font-size: 16px; margin: 4px 0 10px; overflow-wrap: anywhere; }
  /* The one thing to read before deciding. */
  .focus { background: var(--soft); border-radius: 8px; padding: 10px 12px; overflow-wrap: anywhere; }
  .focus .label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 2px; }
  .focus code, .warn code { font: 13px ui-monospace, monospace; background: var(--card); border-radius: 4px; padding: 0 4px; }
  .proved { color: var(--ok); font-size: 14px; margin-top: 10px; }
  .warn { color: var(--warn); font-size: 14px; margin: 8px 0 0; padding-left: 18px; }
  .bad { color: var(--bad); font-size: 14px; margin-top: 8px; overflow-wrap: anywhere; }
  .shots { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
  .shot { color: var(--muted); text-decoration: none; font-size: 12px; }
  /* The whole width of the page, scaled to the card: a corner at real size hid
     most of what the proof showed. Long pages are cut at the bottom. */
  .shot img { display: block; width: 100%; height: auto; max-height: 520px; object-fit: cover;
              object-position: left top; background: #fff; border: 1px solid var(--line);
              border-radius: 6px; margin-bottom: 2px; }
  .steps { font: 12px ui-monospace, monospace; color: var(--muted); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  .actions .spacer { flex: 1; }
  .reply { margin-top: 10px; }
  details { margin-top: 10px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  details code, details pre { display: block; font: 12px ui-monospace, monospace; overflow-wrap: anywhere;
              white-space: pre-wrap; margin: 4px 0; }
  details pre { background: var(--soft); border-radius: 6px; padding: 6px 8px; max-height: 240px; overflow: auto; }
  details p { margin: 6px 0; }
  .empty { color: var(--muted); padding: 12px 0; }
  .line { display: flex; gap: 10px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid var(--line);
          font-size: 14px; overflow-wrap: anywhere; }
  .line .what { flex: 1; min-width: 0; }
  .line .state { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--info); flex: none; align-self: center;
         animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .3; } }
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px;
           width: min(600px, calc(100vw - 32px)); padding: 16px; }
  dialog form.go { display: flex; gap: 8px; margin: 10px 0; }
  dialog form.go input { flex: 1; min-width: 0; }
  dialog ul { list-style: none; padding: 0; margin: 10px 0; max-height: 45vh; overflow: auto; }
  dialog li button { width: 100%; text-align: left; border: none; border-radius: 6px; }
  dialog li button:hover { background: var(--bg); }
  .repo { color: var(--ok); font-size: 12px; margin-left: 6px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
  .team-pick { display: flex; gap: 8px; align-items: center; margin: 12px 0 4px; font-size: 14px; }
  .team-pick select, #team-catalog { flex: 1; min-width: 0; }
  #team-roles li { display: flex; gap: 10px; align-items: baseline; padding: 4px; }
  #team-roles li button { width: auto; padding: 2px 4px; color: inherit; }
  #team-roles .out button { color: var(--muted); text-decoration: line-through; }
  #team-role { display: grid; gap: 8px; margin: 10px 0; }
  .row .spacer { flex: 1; }
  .field { display: grid; gap: 4px; margin: 12px 0 4px; font-size: 14px; }
  .field .go { display: flex; gap: 8px; }
  .field .go input { flex: 1; min-width: 0; }
  #settings-models li { display: flex; gap: 8px; align-items: center; padding: 2px 4px; }
  @media (max-width: 700px) {
    #new-request { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>fennec</h1>
    <button class="link" id="add-project">+ projet</button>
    <button class="link" id="open-team">Équipe</button>
    <button class="link" id="open-settings">Réglages</button>
  </header>

  <form id="new-request">
    <select id="project" aria-label="Projet" required></select>
    <textarea id="text" aria-label="Demande" placeholder="Ce que tu veux…" required></textarea>
    <button class="primary">Demander</button>
  </form>
  <p class="error" id="error" role="alert"></p>

  <h2>À toi <span id="n-todo"></span></h2>
  <div id="todo"></div>

  <h2>fennec travaille</h2>
  <div id="running"></div>

  <h2>Intégré récemment</h2>
  <div id="landed"></div>
</main>

<dialog id="team">
  <strong id="team-title">Équipe</strong>
  <label class="team-pick">Équipe du projet
    <select id="team-name"></select>
  </label>
  <ul id="team-roles"></ul>
  <form class="go" id="team-add">
    <select id="team-catalog" aria-label="Rôle à ajouter"></select>
    <button>Ajouter</button>
  </form>
  <form id="team-role" hidden>
    <input id="role-name" aria-label="Nom du rôle" placeholder="Nom du rôle" required>
    <select id="role-stage" aria-label="Étape"></select>
    <textarea id="role-brief" aria-label="Ce que fait ce rôle" rows="6"
      placeholder="Ce que ce rôle exige, en une poignée de phrases" required></textarea>
    <textarea id="role-checks" aria-label="Commandes lancées à chaque preuve" rows="2"
      placeholder="Commandes lancées à chaque preuve, une par ligne : si l'une échoue, ce n'est pas prêt"></textarea>
    <div class="row"><button type="button" id="role-cancel">Annuler</button>
      <button class="primary">Enregistrer le rôle</button></div>
  </form>
  <form class="go" id="team-save" hidden>
    <input id="team-new-name" aria-label="Nom de la nouvelle équipe" placeholder="Nom de la nouvelle équipe" required>
    <button class="primary">Enregistrer</button>
  </form>
  <p class="error" id="team-error" role="alert"></p>
  <div class="row">
    <button type="button" class="quiet" id="role-new">+ nouveau rôle</button>
    <button type="button" class="quiet" id="team-save-open">Enregistrer comme équipe…</button>
    <span class="spacer"></span>
    <button type="button" id="team-close">Fermer</button>
  </div>
</dialog>
<dialog id="settings">
  <strong>Réglages</strong>
  <form id="settings-form">
    <label class="field">Serveur du modèle
      <span class="go"><input id="settings-url" required placeholder="http://localhost:8000/v1">
        <button type="button" id="settings-test">Tester</button></span>
    </label>
    <div class="muted" id="settings-status"></div>
    <ul id="settings-models"></ul>
    <label class="field">Clé d'accès (facultative)
      <input id="settings-key" type="password" autocomplete="off">
    </label>
    <p class="muted" id="settings-env" hidden></p>
    <p class="error" id="settings-error" role="alert"></p>
    <div class="row">
      <button type="button" id="settings-cancel">Annuler</button>
      <button class="primary">Enregistrer</button>
    </div>
  </form>
</dialog>
<dialog id="picker">
  <strong>Choisir un projet</strong>
  <form class="go" id="picker-go">
    <input id="picker-input" aria-label="Chemin du dossier" placeholder="Colle un chemin, ou parcours ci-dessous">
    <button type="submit">Aller</button>
  </form>
  <div class="muted" id="picker-path"></div>
  <ul id="picker-list"></ul>
  <div class="row">
    <button type="button" id="picker-cancel">Annuler</button>
    <button type="button" class="primary" id="picker-choose">Ajouter ce dossier</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
