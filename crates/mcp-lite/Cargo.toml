[package]
name = "mcp-lite"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A small synchronous Model Context Protocol client with a lazy tool layer"
readme = "README.md"
keywords = ["mcp", "model-context-protocol", "llm", "agent", "tools"]
categories = ["api-bindings", "development-tools", "network-programming"]

[features]
default = ["client"]
client = ["dep:ureq"]
oauth = ["client", "dep:ring", "dep:base64"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"], optional = true }
ring = { version = "0.17", optional = true }
base64 = { version = "0.23", optional = true }

[lints]
workspace = true
