[package]
name = "fennec"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
base64 = "0.23"
llm-providers-connector = "0.2.0"
token-usage = { path = "../token-usage" }
backlog = { path = "../backlog" }
rules = { path = "../rules" }
canvas = { path = "../canvas" }
ring = "0.17"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }

[lints]
workspace = true
