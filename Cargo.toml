[workspace]
resolver = "3"
members = ["crates/backlog", "crates/canvas", "crates/fennec", "crates/rules", "crates/token-usage"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "AGPL-3.0-only"

# fennec stays light: one optimised, stripped binary. Panics still unwind:
# a bug in one request must not take running turns down with it.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The complexity ceiling VIBECODING.md declares (threshold in clippy.toml).
[workspace.lints.clippy]
cognitive_complexity = "warn"
