name: convention

# The Vibecoding Convention's evidence, regenerated on main only (the Actions
# minutes are a budget): coverage, advisories, outdated dependencies and
# duplication, then vibecheck writes audit/status.json, which the README badge reads.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor blocks bwrap's network namespace setup.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-llvm-cov,cargo-audit,cargo-outdated
      - name: Coverage
        run: TMPDIR="$RUNNER_TEMP" cargo llvm-cov --workspace --summary-only > audit/evidence/coverage.txt
      - name: Advisories
        run: cargo audit --json > audit/evidence/audit.json
      - name: Outdated dependencies
        run: |
          (cd web && npm ci)
          python3 scripts/outdated.py > audit/evidence/outdated.txt
      - name: Duplication
        run: npx -y jscpd@4.3.0 crates web/src --silent --reporters json --output audit/evidence
      - name: vibecheck
        run: |
          cargo install --locked --git https://github.com/ikarys/vibecoding-convention --rev c327f8483102cf6ea06e8cd02a49d3c78372cf00 vibecheck
          # Not --strict: a warning (a declared model not yet attributed since
          # adoption) shows in the status, it does not fail main.
          vibecheck . --write-status
      - name: Commit the status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/status.json audit/evidence
          git diff --cached --quiet || git commit -m "chore: refresh the Vibecoding Convention status [skip ci]"
          git push
