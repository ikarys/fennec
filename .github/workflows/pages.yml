name: pages

# The project site, https://ikarys.github.io/fennec/: published from main only.
on:
  push:
    branches: [main]
    paths: ["site/**", "docs/images/site/**", "docs/images/brand/**", "docs/images/night-report.png", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      # The screenshots live once, in docs/images, next to the README's.
      - run: |
          mkdir -p site/images
          cp docs/images/site/*.png docs/images/night-report.png site/images/
          cp -r docs/images/brand site/images/brand
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
