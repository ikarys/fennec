# Its own workflow: a title edit must not re-run (or cancel) the checks.
# The squash title becomes the commit release-please reads.
name: pr-title

on:
  pull_request:
    branches: [develop, main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The title goes through a file, never into the script: no injection.
      - name: Validate PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"
