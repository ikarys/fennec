name: build

on:
  workflow_call:
    inputs:
      label:
        required: true
        type: string
  # By hand, to try a branch's binaries (the macOS ones cannot be built anywhere else).
  workflow_dispatch:
    inputs:
      label:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        # Ubuntu 22.04 links against glibc 2.35, so the binary runs on older hosts too.
        # Both macOS targets build on the Apple Silicon runner: its SDK cross-compiles to Intel.
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web UI
        run: |
          cd web
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build binary
        run: cargo build --release --locked --target ${{ matrix.target }} -p fennec
      - name: Pack release
        run: |
          set -euo pipefail
          name="fennec-${{ inputs.label }}-${{ matrix.target }}"
          mkdir -p "$name"
          cp "target/${{ matrix.target }}/release/fennec" "$name/fennec"
          cp LICENSE README.md THIRD_PARTY.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: fennec-${{ matrix.target }}
          path: |
            fennec-${{ inputs.label }}-${{ matrix.target }}.tar.gz
            fennec-${{ inputs.label }}-${{ matrix.target }}.tar.gz.sha256
