name: ci

# Documentation alone builds nothing and changes no test: skip the gate. Not
# `**.md`: the agents and skills under crates/ are embedded in the binary.
on:
  pull_request:
    branches: [develop, main]
    paths-ignore: &docs
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - THIRD_PARTY.md
      - CHANGELOG.md
      - LICENSE
      - docs/**
  push:
    branches: [develop, main]
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The conventions: the UI compiles and keeps its primitives, rustfmt, clippy.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Build the UI
        run: just web
      - name: Lint
        run: just lint

  # The unit tests, the sandbox's included (they need bwrap).
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor blocks bwrap's network namespace setup;
      # without this the sandbox tests fail instead of exercising the sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Unit tests
        run: just test

  edge-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [check, tests]
    uses: ./.github/workflows/build.yml
    with:
      label: edge

  edge-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: edge-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete edge --cleanup-tag -y || true
          gh release create edge --prerelease --target "$GITHUB_SHA" --title "edge (develop)" --notes "Rolling build of develop at $GITHUB_SHA. Not a release." ./*
