name: ci

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor blocks bwrap's network namespace setup;
      # without this the sandbox tests fail instead of exercising the sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - name: Check
        run: just check

  edge-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      label: edge

  edge-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: edge-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete edge --cleanup-tag -y || true
          gh release create edge --prerelease --target "$GITHUB_SHA" --title "edge (develop)" --notes "Rolling build of develop at $GITHUB_SHA. Not a release." ./*
