name: ci

# Actions minutes are a budget: the gate runs once per PR, not again on the
# push its squash makes (develop gets exactly what the PR tested).
on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What every change passes, documentation included.
  guard:
    runs-on: ubuntu-24.04
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No secret anywhere in the history, not only in this PR's diff.
      - name: Secrets
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          PATH="$RUNNER_TEMP:$PATH" gitleaks git --no-banner --redact .
      # The squash title becomes the commit release-please reads.
      # The title goes through a file, never into the script: no injection.
      - name: PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"
      # Documentation alone builds nothing and changes no test: the gate below
      # is skipped by a job condition, which a required check accepts, where a
      # workflow-level paths-ignore would leave it pending forever. Not `**.md`:
      # the agents and skills under crates/ are embedded in the binary.
      # The checkout is the PR's merge commit, so its first parent is the base.
      - name: Scope
        id: scope
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qvE '^(README\.md|AGENTS\.md|CLAUDE\.md|THIRD_PARTY\.md|CHANGELOG\.md|LICENSE|docs/.*)$' <<<"$files"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  # The conventions: the UI compiles and keeps its primitives, rustfmt, clippy.
  check:
    needs: guard
    if: needs.guard.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Build the UI
        run: just web
      - name: UI rules
        run: node web/scripts/check-ui.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # A new dependency must come under a licence the AGPL can absorb.
      - name: Licenses
        run: just licenses
      - name: UI tests
        run: just test-web

  # The unit tests, the sandbox's included (they need bwrap).
  tests:
    needs: guard
    if: needs.guard.outputs.code == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor blocks bwrap's network namespace setup;
      # without this the sandbox tests fail instead of exercising the sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - name: Unit tests
        run: just test
