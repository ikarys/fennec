name: ci

# Actions minutes are a budget: the gate runs once per PR, not again on the
# push its squash makes (develop gets exactly what the PR tested). Documentation
# alone builds nothing and changes no test: skip the gate. Not `**.md`: the
# agents and skills under crates/ are embedded in the binary.
on:
  pull_request:
    branches: [develop, main]
    paths-ignore: &docs
      - README.md
      - AGENTS.md
      - CLAUDE.md
      - THIRD_PARTY.md
      - CHANGELOG.md
      - LICENSE
      - docs/**

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The conventions: the UI compiles and keeps its primitives, rustfmt, clippy.
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No secret anywhere in the history, not only in this PR's diff.
      - name: Secrets
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          PATH="$RUNNER_TEMP:$PATH" gitleaks git --no-banner --redact .
      # The squash title becomes the commit release-please reads. Checked here,
      # not in a workflow of its own: each job is billed at least a minute.
      # The title goes through a file, never into the script: no injection.
      - name: PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$PR_TITLE" > "$RUNNER_TEMP/title"
          .githooks/commit-msg "$RUNNER_TEMP/title"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Build the UI
        run: just web
      - name: UI rules
        run: node web/scripts/check-ui.mjs
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      # A new dependency must come under a licence the AGPL can absorb.
      - name: Licenses
        run: just licenses
      - name: UI tests
        run: just test-web

  # The unit tests, the sandbox's included (they need bwrap).
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install bubblewrap
        run: sudo apt-get update -y && sudo apt-get install -y bubblewrap
      # Ubuntu 24.04's AppArmor blocks bwrap's network namespace setup;
      # without this the sandbox tests fail instead of exercising the sandbox.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v4
      - name: Unit tests
        run: just test
