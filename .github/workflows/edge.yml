name: edge

# The rolling edge prerelease of develop, built on demand: two release builds
# (x86_64, aarch64) on every merge used more than half of the Actions minutes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      label: edge

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Publish edge release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release delete edge --cleanup-tag -y || true
          gh release create edge --prerelease --target "$GITHUB_SHA" --title "edge (develop)" --notes "Rolling build of develop at $GITHUB_SHA. Not a release." ./*
